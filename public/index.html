<!DOCTYPE html>
<html lang="en" data-theme="masseffect" data-console="ps">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Bradly's personal dashboard — projects, fitness, book writing, notebook.">
  <meta name="theme-color" content="#05080f">
  <title>Dyer HQ — Dashboard</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dyer HQ">
  <!-- real shipped logo beats a generic emoji in the tab and bookmarks -->
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fonts load async: a render-blocking stylesheet also blocks module scripts,
       so a slow fonts.googleapis.com would leave the whole dashboard blank -->
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cinzel:wght@500;700&family=Exo+2:wght@400;600;700;800&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=VT323&display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cinzel:wght@500;700&family=Exo+2:wght@400;600;700;800&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=VT323&display=swap"></noscript>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/fx.css">
  <link rel="stylesheet" href="/css/xbox.css">
  <link rel="stylesheet" href="/css/polish.css">
  <link rel="stylesheet" href="/css/game/ps5home.css">
  <link rel="stylesheet" href="/css/game/assassins.css">
  <link rel="stylesheet" href="/css/game/cyberpunk.css">
  <link rel="stylesheet" href="/css/game/gtav.css">
  <link rel="stylesheet" href="/css/game/minecraft.css">
  <link rel="stylesheet" href="/css/game/xboxhome.css">
  <link rel="stylesheet" href="/css/mobile.css">
  <!-- warm the shell's most-imported modules with the first paint so their
       fetch starts now instead of waterfalling behind main.js's parse -->
  <link rel="modulepreload" href="/js/store.js">
  <link rel="modulepreload" href="/js/data.js">
  <link rel="modulepreload" href="/js/icons.js">
  <link rel="modulepreload" href="/js/sfx.js">
</head>
<body>
  <!-- no src ships: a video background is opt-in, so the file is only fetched
       once applyBg/playThemeBg point the element at it (see main.js). Shipping
       src=/media/bg.mp4 made every visit hit the network even in Storm/Off. -->
  <video id="bg-video" muted loop playsinline preload="metadata" hidden aria-hidden="true"></video>
  <div id="ambient" aria-hidden="true"></div>
  <canvas id="storm-canvas" hidden aria-hidden="true"></canvas>
  <div id="theme-fx" aria-hidden="true"></div>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <header id="topbar">
    <div class="topbar-left">
      <span id="brand-mark" aria-hidden="true"></span>
      <h1 id="brand">DYER HQ</h1>
      <span id="brand-sub">personal dashboard</span>
    </div>
    <div class="topbar-right">
      <button id="console-btn" class="top-icon-btn" title="Switch console view" aria-label="Switch console view"></button>
      <button id="cc-btn" class="top-icon-btn" title="Control center (c)" aria-label="Open control center"></button>
      <button id="profile-chip" title="Bradly"><span id="profile-avatar">B</span><span id="profile-name">Bradly</span><span id="profile-score"></span></button>
      <nav id="theme-switcher" aria-label="Theme">
        <button class="theme-dot" data-set-theme="assassins"  title="Assassin's Creed theme"><span>AC</span></button>
        <button class="theme-dot" data-set-theme="cyberpunk"  title="Cyberpunk theme"><span>CP</span></button>
        <button class="theme-dot" data-set-theme="gtav"       title="GTA V theme"><span>V</span></button>
        <button class="theme-dot" data-set-theme="minecraft"  title="Minecraft theme"><span>MC</span></button>
        <button class="theme-dot" data-set-theme="masseffect" title="Mass Effect theme"><span>N7</span></button>
        <button class="theme-dot" data-set-theme="xboxgreen" title="Xbox theme"><span>XB</span></button>
        <button class="theme-dot" data-set-theme="playstation" title="PlayStation theme"><span>PS</span></button>
        <button class="theme-dot" data-set-theme="xboxone" title="Xbox One theme"><span>X1</span></button>
      </nav>
      <div id="clock" aria-live="off">
        <span id="clock-time">--:--</span>
        <span id="clock-date"></span>
      </div>
    </div>
  </header>

  <nav id="pill-nav" aria-label="Sections">
    <button class="pill active" data-pill="home">Home</button>
    <button class="pill" data-pill="apps">My apps</button>
    <button class="pill" data-pill="trophies">Achievements</button>
    <button class="pill" data-pill="sync">Sync</button>
  </nav>

  <main id="home" aria-label="Dashboard">
    <section id="hero" aria-live="polite">
      <span id="hero-watermark" aria-hidden="true"></span>
      <div id="hero-icon" aria-hidden="true"></div>
      <div id="hero-text">
        <h2 id="hero-title">&nbsp;</h2>
        <p id="hero-desc">&nbsp;</p>
        <div id="hero-actions"></div>
      </div>
    </section>

    <section id="activity" aria-label="Activity"></section>

    <section id="rail-wrap">
      <div id="rail" role="listbox" aria-label="Apps and projects" tabindex="0"></div>
    </section>

    <p id="hint" aria-hidden="true"><span class="btn-glyph">✕</span> open&nbsp;&nbsp;<span class="btn-glyph">○</span> back&nbsp;&nbsp;<span class="btn-glyph">▤</span> center&nbsp;&nbsp;·&nbsp;&nbsp;◀ ▶ browse</p>
  </main>

  <!-- Control center / guide (populated by main.js) -->
  <div id="ccenter" hidden>
    <div id="cc-sheet" role="dialog" aria-label="Control center">
      <div id="cc-actions"></div>
      <div id="cc-extra" hidden></div>
    </div>
  </div>

  <!-- theme-switch transition overlay (fx.css) -->
  <div id="switch-fx" aria-hidden="true"></div>

  <!-- boot splash -->
  <div id="boot" aria-hidden="true"><div id="boot-inner"><span id="boot-icon"></span><span id="boot-text">DYER HQ</span></div></div>

  <!-- Full-screen module view (fitness / writing / notebook / projects) -->
  <div id="appview" hidden>
    <header id="appview-bar">
      <button id="appview-back" aria-label="Back to dashboard">‹ Dashboard</button>
      <h2 id="appview-title"></h2>
      <div id="appview-tools"></div>
    </header>
    <div id="appview-body"></div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>

name: Deploy to Cloudflare

# Optional deploy path. The primary deploy route is Cloudflare Workers Builds
# (Git integration), which needs no secrets here and deploys main on every
# push. This workflow only runs wrangler if CLOUDFLARE_API_TOKEN is configured;
# otherwise it says so and finishes green, so a red check here always means a
# real failure rather than "no token".
#   CLOUDFLARE_API_TOKEN  — API token with "Edit Cloudflare Workers" permissions
#   CLOUDFLARE_ACCOUNT_ID — from the Cloudflare dashboard right sidebar
#
# Two jobs on purpose. GitHub validates every `uses:` action against the
# repository's Actions permissions when a job is CREATED — even steps that a
# later `if:` would skip — and a rejected job dies before a runner is assigned,
# with no steps and no logs. So the no-token path must reference no actions at
# all: `check` is pure shell, and `deploy` is gated at the job level, which
# means it is never created (and never policy-checked) unless a token exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      have_token: ${{ steps.gate.outputs.have_token }}
    steps:
      - name: Check for Cloudflare token
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "have_token=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is set — deploying with wrangler."
          else
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN not set — nothing to do here. Workers Builds (Git integration) deploys main."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.have_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
